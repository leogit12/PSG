<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSX Emulator</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <div id="game"></div>

  <script type="text/javascript">
      EJS_player = '#game';
      EJS_core = 'psx';
      
      // Point directly to the emulator folder in your repo
      EJS_pathtodata = './emulator/';
      
      // Keep gameUrl blank to allow manual file picking
      EJS_gameUrl = ''; 
  </script>
  
  <!-- Load your locally hosted loader.js -->
  <script src="./emulator/loader.js"></script>

</body>
</html>
